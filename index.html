<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Tool_V3.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header class="page-header">
    <h1>Markdown Tool_V3.1</h1>
    <span id="heading-count" class="sr-only" aria-live="polite">0 headings</span>
  </header>

  <section id="analysis-panel" class="analysis" aria-label="Heading structure workspace">
    <div id="analysis-content" class="analysis-content">
      <div class="structure-mapping-bar">
        <div class="tree-control-pane">
          <span class="tree-control-label">Source Level</span>
          <div id="source-levels" class="level-strip source-levels" aria-label="Choose source level">
            <span class="source-level-pair"><button type="button" data-level="1" data-source-mode="single">H1</button><button type="button" data-level="1" data-source-mode="and-below" aria-label="H1 and below">H1+</button></span>
            <span class="source-level-pair"><button type="button" data-level="2" data-source-mode="single">H2</button><button type="button" data-level="2" data-source-mode="and-below" aria-label="H2 and below">H2+</button></span>
            <span class="source-level-pair"><button type="button" data-level="3" data-source-mode="single">H3</button><button type="button" data-level="3" data-source-mode="and-below" aria-label="H3 and below">H3+</button></span>
            <span class="source-level-pair"><button type="button" data-level="4" data-source-mode="single">H4</button><button type="button" data-level="4" data-source-mode="and-below" aria-label="H4 and below">H4+</button></span>
            <span class="source-level-pair"><button type="button" data-level="5" data-source-mode="single">H5</button><button type="button" data-level="5" data-source-mode="and-below" aria-label="H5 and below">H5+</button></span>
            <span class="source-level-pair"><button type="button" data-level="6" data-source-mode="single">H6</button><button type="button" data-level="6" data-source-mode="and-below" aria-label="H6 and below">H6+</button></span>
          </div>
          <div class="quick-source-strip"><button id="lowest-level" type="button" data-quick-source="lowest">Minimum Level</button></div>
        </div>

        <div class="tree-control-pane">
          <span class="tree-control-label">Target Level</span>
          <div id="target-levels" class="level-strip target-levels" aria-label="Choose target level">
            <button type="button" data-level="1">H1</button><button type="button" data-level="2">H2</button><button type="button" data-level="3">H3</button><button type="button" data-level="4">H4</button><button type="button" data-level="5">H5</button><button type="button" data-level="6">H6</button>
          </div>
          <div id="preset-targets" class="preset-targets" aria-label="Choose body preset"></div>
        </div>

        <div class="mapping-footer">
          <p id="mapping-status" class="sr-only" aria-live="polite"></p>
          <div class="sticky-actions" aria-label="Editing toolbar">
            <div class="copy-split">
              <button id="copy-rich-button" class="copy-main" type="button">Copy Rich Text</button>
              <button id="copy-menu-button" class="copy-menu-toggle" type="button" aria-label="More copy options" aria-haspopup="menu" aria-expanded="false">▾</button>
              <div id="copy-menu" class="copy-menu" role="menu" hidden><button id="copy-rich-option" type="button" role="menuitemradio">Copy Rich Text</button><button id="copy-markdown-button" type="button" role="menuitemradio">Copy Markdown</button></div>
            </div>
            <span class="toolbar-spacer" aria-hidden="true"></span>
            <div class="sticky-action-group icon-group">
              <button id="undo-button" class="icon-button" type="button" title="Undo" aria-label="Undo" disabled><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 5 11l4 4"/><path d="M5 11h8a6 6 0 0 1 6 6"/></svg></button>
              <button id="redo-button" class="icon-button" type="button" title="Redo" aria-label="Redo" disabled><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 4 4-4 4"/><path d="M19 11h-8a6 6 0 0 0-6 6"/></svg></button>
            </div>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <div class="sticky-action-group icon-group">
              <button id="source-up-button" class="icon-button heading-shift" type="button" title="Promote selected headings" aria-label="Promote selected headings" disabled><span>H</span>↑</button>
              <button id="source-down-button" class="icon-button heading-shift" type="button" title="Demote selected headings" aria-label="Demote selected headings" disabled><span>H</span>↓</button>
            </div>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button id="reset-button" class="reset-action" type="button">Reset</button>
            <button id="continue-button" class="primary-action" type="button">Continue from Here</button>
          </div>
        </div>
        <div id="sticky-status-slot" class="notice-area sticky-status-slot" aria-live="polite">
          <div id="risk-message" class="risk" role="alert" hidden></div>
          <p id="status-message" class="status" role="status"></p>
        </div>
      </div>

      <div class="tree-labels" aria-hidden="true"><span>Before</span><span>After</span></div>
      <div id="structure-view" class="structure-view"><p class="empty-state">Add Markdown to see its heading structure.</p></div>
    </div>
  </section>

  <section class="utility-panel" aria-label="Text cleanup"><div class="utility-row">
    <button id="remove-breaks-button" type="button">Remove Dividers</button>
    <button id="compress-guide-lines-button" type="button">Compress Guide Lines</button>
    <button id="remove-inline-code-button" type="button">Remove Inline Code</button>
  </div></section>

  <section class="editor" aria-label="Markdown editing workspace">
    <div class="text-panel"><label for="markdown-input">Input Markdown</label><textarea id="markdown-input" placeholder="Paste or type Markdown here" spellcheck="false"></textarea></div>
    <div class="text-panel result-panel">
      <div class="preview-heading"><span id="result-preview-label">Result Preview</span><div class="preview-modes" role="group" aria-label="Preview mode">
        <button id="markdown-preview-button" type="button" aria-pressed="false">Markdown</button>
        <button id="rich-preview-button" type="button" class="active" aria-pressed="true">Rich Text</button>
      </div></div>
      <div id="rich-preview" class="rich-preview" tabindex="0" aria-labelledby="result-preview-label" aria-live="polite"></div>
      <textarea id="markdown-output" class="markdown-preview" readonly aria-labelledby="result-preview-label" aria-live="polite" hidden></textarea>
    </div>
  </section>

  <section class="preset-settings" aria-label="Body preset settings"><details class="preset-manager">
    <summary>Manage Body Presets</summary><div id="preset-editor"></div><button id="add-preset-button" type="button">New Body Preset</button>
  </details></section>
</main>
<script src="script.js"></script>
</body>
</html>
